<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acervo do Time</title>
  <meta name="description" content="O museu oficial dos momentos cômicos do time de produtos da AUVP.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">

  <!-- Tema aplicado antes da primeira pintura, para não piscar branco -->
  <script>
    (function () {
      try {
        var salvo = localStorage.getItem('auvp-theme');
        var escuro = salvo === 'dark' ||
          (salvo !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (escuro) document.documentElement.classList.add('dark');
      } catch (e) { /* modo anônimo: segue o padrão claro */ }
    })();
  </script>

  <!-- Fontes do Design System AUVP: Anek Latin (títulos), Roboto (texto), Sora (interface) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- ===================== TOPO ===================== -->
  <header class="topo">
    <a class="marca" href="#/" aria-label="Ir para a home do acervo">
      <span class="marca__icone" aria-hidden="true">🏛️</span>
      <span class="marca__texto">
        <strong data-slot="nome-site">Acervo do Time</strong>
        <small data-slot="subtitulo">carregando as evidências…</small>
      </span>
    </a>

    <button class="menu-botao" id="menu-botao" aria-expanded="false" aria-controls="nav-principal">
      <span aria-hidden="true">☰</span>
      <span class="sr-only">Abrir menu</span>
    </button>

    <nav class="nav" id="nav-principal" aria-label="Navegação principal">
      <a href="#/" data-rota="/">Início</a>
      <a href="#/frases" data-rota="/frases">Frases</a>
      <a href="#/galeria" data-rota="/galeria">Galeria</a>
      <a href="#/momentos" data-rota="/momentos">Momentos</a>
      <a href="#/hall" data-rota="/hall">Hall da Fama</a>
      <a href="#/time" data-rota="/time">O Time</a>
    </nav>

    <div class="acoes-topo">
      <button class="icone-botao" id="tema-botao" title="Tema: Sistema">
        <span id="tema-icone" aria-hidden="true">🖥️</span>
        <span class="sr-only" id="tema-label">Sistema</span>
      </button>

      <button class="icone-botao" id="editor-botao" aria-expanded="false" aria-controls="ed-painel"
              title="Modo edição — alterar textos, datas e afins">
        <span aria-hidden="true">✏️</span>
        <span class="sr-only">Modo edição</span>
      </button>
    </div>
  </header>

  <!-- ===================== CONTEÚDO ===================== -->
  <main id="app" class="conteudo" tabindex="-1">
    <p class="carregando">Abrindo as gavetas do acervo…</p>
  </main>

  <!-- ===================== RODAPÉ ===================== -->
  <footer class="rodape">
    <p data-slot="rodape"></p>
    <p class="rodape__meta">
      <span data-slot="contagem"></span> ·
      <a href="#/como-contribuir">Como adicionar conteúdo</a>
    </p>
  </footer>

  <!-- ===================== LIGHTBOX ===================== -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__fechar" id="lightbox-fechar" aria-label="Fechar">✕</button>
    <figure class="lightbox__conteudo">
      <div class="lightbox__midia" id="lightbox-midia"></div>
      <figcaption id="lightbox-legenda"></figcaption>
    </figure>
  </div>

  <!-- ===================== DADOS ===================== -->
  <script src="data/config.js"></script>
  <script src="data/time.js"></script>
  <script src="data/frases.js"></script>
  <script src="data/momentos.js"></script>
  <script src="data/galeria.js"></script>
  <script src="data/premios.js"></script>

  <!-- ===================== APLICAÇÃO ===================== -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/views.js"></script>
  <!-- Antes do app.js: aplica o rascunho local antes do primeiro desenho -->
  <script src="assets/js/editor.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
